<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111112">
  <title>2024 年度作品集｜天将明</title>
  <link rel="stylesheet" href="page-flip.min.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111112;color:#f5f4ef;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    a{color:inherit;text-decoration:none}.topbar{position:fixed;z-index:20;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(17,17,18,.65);border-bottom:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px)}.back{display:flex;align-items:center;gap:9px;font-size:11px}.back b{font-size:19px;font-weight:400}.back small{display:block;margin-top:3px;font-size:7px;letter-spacing:.14em}.crossnav{display:flex;gap:18px;font-size:9px;letter-spacing:.09em}.crossnav a:hover{text-decoration:underline}.reader{position:fixed;inset:64px 0 56px;display:grid;place-items:center;overflow:hidden}.reader::before{content:"ARCHIVE / 2024";position:absolute;left:18px;top:17px;font-size:8px;letter-spacing:.18em;color:#999}#book-container{transform-origin:center center;background:#111112}.controls{position:fixed;z-index:20;left:0;right:0;bottom:0;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;background:rgba(17,17,18,.7);border-top:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px)}.controls button{color:#fff;border:0;background:transparent;cursor:pointer;font-size:10px;letter-spacing:.1em}.controls button:first-child{text-align:left}.controls button:last-child{text-align:right}#page-num{min-width:100px;text-align:center;font-size:9px;letter-spacing:.12em}.portrait-note{display:none}
    @media(max-width:680px){.crossnav a:not([data-site=main]){display:none}.topbar{height:58px}.reader{inset:58px 0 58px}.reader::before{top:10px}.portrait-note{position:absolute;z-index:2;top:10px;right:12px;display:block;color:#aaa;font-size:7px;letter-spacing:.08em}.controls{height:58px;padding:0 12px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="back" data-site="main" href="https://tianming332.github.io/JiangmingTian_Portfolio_Final/"><b>←</b><span>返回主站<small>BACK TO MAIN</small></span></a><nav class="crossnav"><a data-site="applied" href="https://tianming332.github.io/Applied-Brand-Desig_wed/">落地项目</a><a data-site="video" href="https://tianming332.github.io/Tian_vidos/">AI-Videos</a></nav></header>
  <main class="reader"><span class="portrait-note">竖屏将使用单页模式</span><div id="book-container" class="demo-book"></div></main>
  <div class="controls"><button id="prevPage" type="button">← 上一页 / PREV</button><div id="page-num">01 / 50</div><button id="nextPage" type="button">下一页 / NEXT →</button></div>
  <script src="page-flip.browser.min.js"></script>
  <script src="site-links.js"></script>
  <script>
    const TOTAL=50, paths=Array.from({length:TOTAL},(_,i)=>`images/page (${i+1}).jpg`);
    const pageFlip=new St.PageFlip(document.getElementById("book-container"),{width:1680,height:1189,size:"stretch",minWidth:320,maxWidth:1680,minHeight:226,maxHeight:1189,maxShadowOpacity:.42,showCover:false,mobileScrollSupport:false,useMouseEvents:true,usePortrait:true});
    pageFlip.loadFromImages(paths);
    const number=document.getElementById("page-num");
    function update(){number.textContent=String(pageFlip.getCurrentPageIndex()+1).padStart(2,"0")+" / "+String(pageFlip.getPageCount()).padStart(2,"0")}
    pageFlip.on("flip",update);pageFlip.on("init",update);
    document.getElementById("prevPage").onclick=()=>pageFlip.flipPrev();document.getElementById("nextPage").onclick=()=>pageFlip.flipNext();
    document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")pageFlip.flipPrev();if(e.key==="ArrowRight")pageFlip.flipNext()});
    document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
  </script>
</body>
</html>
